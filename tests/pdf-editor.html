<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF editor integration fixture</title></head><body>
<main class="workspace"><div class="tool-heading"><h1>Merge PDF</h1><p class="intro">Integration fixture · two local sample PDFs</p></div><section class="workpanel has-files"><section id="pdf-previews" class="pdf-previews"></section><div class="process-actions"><p id="output-summary" hidden></p><button id="process" class="primary">Verify merged output</button></div><p id="result" role="status"></p></section></main>
<script type="module">
import '../src/style.css';
import '../src/mobile.css';
import '../src/upload-controls.css';
import {showPdfPreviews,getMergePageOrder} from '../src/pdf-previews.js';
import {getDocument,GlobalWorkerOptions} from 'pdfjs-dist';
import worker from 'pdfjs-dist/build/pdf.worker.min.mjs?url';
import {PDFDocument} from 'pdf-lib';
GlobalWorkerOptions.workerSrc=worker;
const files=await Promise.all(['two-pages.pdf','one-page.pdf'].map(async name=>new File([await (await fetch(name)).arrayBuffer()],name,{type:'application/pdf'})));
showPdfPreviews(document.getElementById('pdf-previews'),files,{split:false,isBusy:()=>false,parsePages:()=>[],openPdf:async file=>getDocument({data:await file.arrayBuffer()}).promise});
document.getElementById('process').onclick=async()=>{
  const order=getMergePageOrder(), out=await PDFDocument.create(), docs=new Map();
  for(const f of files)docs.set(f,await PDFDocument.load(await f.arrayBuffer()));
  for(const {file,index} of order){const [page]=await out.copyPages(docs.get(file),[index]);out.addPage(page);}
  const doc=await getDocument({data:await out.save()}).promise, text=[];
  for(let n=1;n<=doc.numPages;n++)text.push((await (await doc.getPage(n)).getTextContent()).items.map(i=>i.str).join(' '));
  document.getElementById('result').textContent=JSON.stringify({pages:doc.numPages,order:order.map(c=>c.file.name+':'+(c.index+1)),text});
  await doc.destroy();
};
</script></body></html>
